      type: object
      properties:
        vehicleId:
          type: string
        parkingLotId:
          type: string
        locationName:
          type: string
        locationAddress:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        paidMinutes:
          type: integer
      required: [vehicleId, locationName]

    ExtendSessionRequest:
      type: object
      properties:
