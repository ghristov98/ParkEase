        latitude:
          type: number
        longitude:
          type: number
        type:
          $ref: "#/components/schemas/ParkingType"
        description:
          type: string
          nullable: true
        photos:
          type: array
          items:
            type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/ParkingExtra"
        createdAt:
          type: string
          format: date-time
      required: [id, name, address, latitude, longitude, type, photos, extras, createdAt]

    CreateParkingLotRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        type:
          $ref: "#/components/schemas/ParkingType"
        description:
          type: string
        extraIds:
          type: array
          items:
            type: string
      required: [name, address, latitude, longitude, type]

    UpdateParkingLotRequest:
      type: object
      properties:
