        page:
          type: integer
        totalPages:
          type: integer
      required: [users, total, page, totalPages]

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"

    UpdateProfileRequest:
      type: object
